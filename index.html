<!DOCTYPE html>
<html lang="pt-BR" class="h-full select-none touch-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fus-Ro-Dungeon! - O Mestre do Thu'um</title>
  
  <!-- CONFIGURAÇÕES DE PWA E TELA CHEIA (STANDALONE) -->
  <meta name="theme-color" content="#06090e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FusRoDungeon">
  
  <!-- MANIFESTO PWA EMBUTIDO (Data URI) -->
  <!-- COLOQUE ESTA LINHA NOVA -->
  <link rel="manifest" href="./manifest.json">

  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            nordic: ['Cinzel', 'serif'],
            pixel: ['"Press Start 2P"', 'monospace'],
          },
          colors: {
            skyrim: {
              gold: '#f39c12',
              blue: '#00d2ff',
              dark: '#0a0e17',
              panel: '#121926',
              border: '#1e293b'
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #06090e;
      overflow: hidden;
    }
    .pixel-shadow { text-shadow: 2px 2px 0px #000; }
    .nordic-glow { text-shadow: 0 0 10px rgba(0, 210, 255, 0.6); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col justify-between p-2 sm:p-4 text-white font-pixel antialiased">

  <!-- ==================== TOP BAR / STATUS ==================== -->
  <header class="flex-shrink-0 w-full max-w-2xl mx-auto flex items-center justify-between bg-skyrim-panel/90 border border-slate-800 rounded-lg p-2 sm:px-4 mb-1 shadow-lg">
    <div class="flex items-center space-x-2">
      <span class="text-red-500 text-sm sm:text-base animate-pulse">❤️</span>
      <div class="w-20 sm:w-32 bg-slate-900 border border-slate-700 h-3 sm:h-4 rounded-full overflow-hidden relative">
        <div id="hp-bar" class="bg-gradient-to-r from-red-700 to-red-500 h-full w-full transition-all duration-200"></div>
      </div>
      <span id="hp-text" class="text-[10px] sm:text-xs text-slate-300">100/100</span>
    </div>

    <div class="flex items-center space-x-3 text-[10px] sm:text-xs">
      <div class="flex items-center space-x-1 text-skyrim-gold">
        <span>🪙</span>
        <span id="coins-display">0</span>
      </div>
      <div class="text-skyrim-blue">
        <span>PONTOS: </span>
        <span id="score-display">0</span>
      </div>
    </div>
  </header>

  <!-- ==================== ÁREA PRINCIPAL DO GAME / CANVAS ==================== -->
  <main class="flex-1 min-h-0 w-full max-w-2xl mx-auto relative flex items-center justify-center my-auto">
    
    <canvas id="gameCanvas" class="w-full h-full object-contain rounded-lg border-2 border-slate-800 bg-black shadow-2xl cursor-pointer"></canvas>

    <!-- OVERLAY: TELA DE INÍCIO / GAME OVER -->
    <div id="menu-overlay" class="absolute inset-0 flex items-center justify-center bg-black/80 backdrop-blur-sm z-20 p-4">
      <div class="bg-skyrim-panel border-2 border-skyrim-blue/40 rounded-xl p-4 sm:p-6 text-center max-w-sm w-full shadow-2xl my-auto max-h-full overflow-y-auto">
        <h1 id="menu-title" class="font-nordic text-2xl sm:text-3xl text-skyrim-blue nordic-glow mb-1">FUS-RO-DUNGEON!</h1>
        <p id="menu-subtitle" class="text-[10px] sm:text-xs text-slate-400 mb-4 font-sans">O Mestre do Thu'um nas Catacumbas</p>
        
        <div id="score-summary" class="hidden mb-4 p-2 bg-slate-900/80 rounded border border-slate-800 text-xs">
          <p class="text-slate-300">Pontuação: <span id="final-score" class="text-skyrim-blue">0</span></p>
          <p class="text-slate-300">Moedas Ganhas: <span id="final-coins" class="text-skyrim-gold">0</span></p>
        </div>

        <div class="space-y-2">
          <button id="btn-start" onclick="startGame()" class="w-full py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white rounded-lg border border-cyan-400/30 text-xs sm:text-sm active:scale-95 transition-transform shadow-lg">
            ► JOGAR
          </button>
          <button onclick="openShop()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-skyrim-gold rounded-lg border border-skyrim-gold/30 text-xs active:scale-95 transition-transform">
            🏛️ LOJA DE RUNAS
          </button>
        </div>

        <p class="mt-4 text-[9px] text-slate-500 font-sans">Toque nas pistas no canvas para atacar ou use os botões abaixo.</p>
      </div>
    </div>

    <!-- OVERLAY: LOJA DE RUNAS -->
    <div id="shop-overlay" class="hidden absolute inset-0 flex items-center justify-center bg-black/85 backdrop-blur-md z-30 p-4">
      <div class="bg-skyrim-panel border-2 border-skyrim-gold/50 rounded-xl p-4 max-w-sm w-full max-h-full overflow-y-auto shadow-2xl flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-3">
            <h2 class="font-nordic text-lg text-skyrim-gold">LOJA DE RUNAS</h2>
            <button onclick="closeShop()" class="text-slate-400 hover:text-white text-xs px-2 py-1">✕ FECHAR</button>
          </div>

          <div class="bg-slate-900/90 border border-slate-800 p-2.5 rounded-lg mb-2 flex items-center justify-between">
            <div class="text-left">
              <p class="text-xs text-slate-200">Força da Espada</p>
              <p class="text-[9px] text-slate-400 font-sans">+5 Dano de Ataque</p>
            </div>
            <button onclick="buyUpgrade('damage')" class="px-3 py-1.5 bg-skyrim-gold/20 hover:bg-skyrim-gold/30 border border-skyrim-gold/50 text-skyrim-gold rounded text-[10px] active:scale-95">
              <span id="cost-damage">50</span> 🪙
            </button>
          </div>

          <div class="bg-slate-900/90 border border-slate-800 p-2.5 rounded-lg mb-2 flex items-center justify-between">
            <div class="text-left">
              <p class="text-xs text-slate-200">Vitalidade Nórdica</p>
              <p class="text-[9px] text-slate-400 font-sans">+20 HP Máximo</p>
            </div>
            <button onclick="buyUpgrade('hp')" class="px-3 py-1.5 bg-skyrim-gold/20 hover:bg-skyrim-gold/30 border border-skyrim-gold/50 text-skyrim-gold rounded text-[10px] active:scale-95">
              <span id="cost-hp">40</span> 🪙
            </button>
          </div>

          <div class="bg-slate-900/90 border border-slate-800 p-2.5 rounded-lg mb-2 flex items-center justify-between">
            <div class="text-left">
              <p class="text-xs text-slate-200">Mente Fluida</p>
              <p class="text-[9px] text-slate-400 font-sans">-10% Cooldown Thu'um</p>
            </div>
            <button onclick="buyUpgrade('cooldown')" class="px-3 py-1.5 bg-skyrim-gold/20 hover:bg-skyrim-gold/30 border border-skyrim-gold/50 text-skyrim-gold rounded text-[10px] active:scale-95">
              <span id="cost-cooldown">75</span> 🪙
            </button>
          </div>
        </div>

        <button onclick="closeShop()" class="w-full mt-3 py-2 bg-slate-800 text-slate-300 text-xs rounded border border-slate-700">
          VOLTAR AO MENU
        </button>
      </div>
    </div>

  </main>

  <!-- ==================== BOTÕES DE CONTROLE COMPACTOS ==================== -->
  <footer class="flex-shrink-0 w-full max-w-2xl mx-auto grid grid-cols-3 gap-1.5 sm:gap-2 mt-1">
    <button id="btn-slow" onclick="triggerSlowTime()" class="bg-slate-900 border border-cyan-500/40 hover:border-cyan-400 text-cyan-300 p-2 rounded-lg flex flex-col items-center justify-center active:scale-95 transition-all relative overflow-hidden">
      <span class="text-sm sm:text-base">❄️</span>
      <span class="text-[9px] sm:text-[11px] mt-0.5">LENTIDÃO</span>
      <div id="cooldown-slow" class="absolute inset-0 bg-black/70 flex items-center justify-center text-[10px] text-cyan-400 hidden">
        <span id="cd-slow-text">0s</span>
      </div>
    </button>

    <button id="btn-shout" onclick="triggerShout()" class="bg-gradient-to-b from-cyan-900 to-slate-900 border-2 border-cyan-400 text-white p-2 rounded-lg flex flex-col items-center justify-center active:scale-95 transition-all shadow-lg shadow-cyan-950/50 relative overflow-hidden">
      <span class="text-xs sm:text-sm font-nordic text-cyan-300">FUS-RO-DAH!</span>
      <span class="text-[8px] sm:text-[9px] text-cyan-200/70">EMPURRÃO</span>
      <div id="cooldown-shout" class="absolute inset-0 bg-black/70 flex items-center justify-center text-[11px] text-cyan-300 hidden">
        <span id="cd-shout-text">0s</span>
      </div>
    </button>

    <button id="btn-attack" onclick="handleAttackButton()" class="bg-gradient-to-b from-red-900 to-slate-900 border border-red-500/50 hover:border-red-400 text-red-200 p-2 rounded-lg flex flex-col items-center justify-center active:scale-95 transition-all">
      <span class="text-sm sm:text-base">⚔️</span>
      <span class="text-[9px] sm:text-[11px] mt-0.5">ATACAR</span>
    </button>
  </footer>

  <!-- ==================== LÓGICA DO JOGO (JAVASCRIPT) ==================== -->
  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'hit') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'shout') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.linearRampToValueAtTime(350, now + 0.2);
          osc.frequency.linearRampToValueAtTime(80, now + 0.5);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
          osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'slow') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.6);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
          osc.start(now); osc.stop(now + 0.6);
        } else if (type === 'coin') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.setValueAtTime(1200, now + 0.05);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        }
      } catch (e) {}
    }

    const STORAGE_KEY = 'fus_ro_dungeon_save_v2';
    let gameData = { coins: 0, upgrades: { damage: 0, hp: 0, cooldown: 0 } };

    function loadSaveData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) { try { gameData = JSON.parse(saved); } catch(e) {} }
      updateShopUI();
    }

    function saveGameData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(gameData));
      updateShopUI();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let isPlaying = false;
    let score = 0;
    let coinsEarnedRun = 0;
    let currentLane = 1;
    let playerHp = 100;
    let maxHp = 100;
    let baseDamage = 25;

    let enemies = [];
    let particles = [];
    let lastSpawnTime = 0;
    let spawnInterval = 1800;

    let shoutCooldown = false;
    let shoutCdTime = 6000;
    let slowCooldown = false;
    let slowCdTime = 10000;
    let isSlowMotion = false;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);

    function requestFullscreenMode() {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      }
    }

    window.onload = () => {
      resizeCanvas();
      loadSaveData();
      renderEmptyCanvas();

      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        initAudio();
        if (!isPlaying) return;

        const rect = canvas.getBoundingClientRect();
        const touchY = e.touches[0].clientY - rect.top;
        const laneHeight = rect.height / 3;

        if (touchY < laneHeight) currentLane = 0;
        else if (touchY < laneHeight * 2) currentLane = 1;
        else currentLane = 2;
        
        playerAttack();
      }, { passive: false });

      canvas.addEventListener('mousedown', (e) => {
        initAudio();
        if (!isPlaying) return;
        const rect = canvas.getBoundingClientRect();
        const clickY = e.clientY - rect.top;
        const laneHeight = rect.height / 3;

        if (clickY < laneHeight) currentLane = 0;
        else if (clickY < laneHeight * 2) currentLane = 1;
        else currentLane = 2;
        
        playerAttack();
      });
    };

    window.addEventListener('keydown', (e) => {
      initAudio();
      if (!isPlaying) return;

      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') currentLane = Math.max(0, currentLane - 1);
      else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') currentLane = Math.min(2, currentLane + 1);
      else if (e.key === ' ' || e.key === 'x' || e.key === 'X') playerAttack();
      else if (e.key === 'Enter') triggerShout();
      else if (e.key === 'q' || e.key === 'Q') triggerSlowTime();
    });

    function startGame() {
      initAudio();
      requestFullscreenMode(); // Ativa Tela Cheia Navor
      
      document.getElementById('menu-overlay').classList.add('hidden');
      document.getElementById('shop-overlay').classList.add('hidden');

      maxHp = 100 + (gameData.upgrades.hp * 20);
      playerHp = maxHp;
      baseDamage = 25 + (gameData.upgrades.damage * 5);
      shoutCdTime = Math.max(3000, 6000 - (gameData.upgrades.cooldown * 500));

      score = 0;
      coinsEarnedRun = 0;
      enemies = [];
      particles = [];
      currentLane = 1;
      spawnInterval = 1800;
      isPlaying = true;

      updateUI();
      requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      isPlaying = false;
      gameData.coins += coinsEarnedRun;
      saveGameData();

      document.getElementById('menu-title').innerText = "DERROTA!";
      document.getElementById('menu-subtitle').innerText = "Sua alma permanece nas catacumbas.";
      document.getElementById('final-score').innerText = score;
      document.getElementById('final-coins').innerText = coinsEarnedRun;
      document.getElementById('score-summary').classList.remove('hidden');
      document.getElementById('btn-start').innerText = "► TENTAR NOVAMENTE";
      document.getElementById('menu-overlay').classList.remove('hidden');
    }

    let lastFrameTime = performance.now();

    function gameLoop(now) {
      if (!isPlaying) return;
      const delta = now - lastFrameTime;
      lastFrameTime = now;

      if (now - lastSpawnTime > spawnInterval) {
        spawnEnemy();
        lastSpawnTime = now;
        spawnInterval = Math.max(700, spawnInterval - 10);
      }

      updateGame(delta);
      drawGame();
      requestAnimationFrame(gameLoop);
    }

    function spawnEnemy() {
      const lane = Math.floor(Math.random() * 3);
      const isLarge = Math.random() < 0.25;

      enemies.push({
        x: canvas.width + 30,
        lane: lane,
        hp: isLarge ? 80 : 35,
        maxHp: isLarge ? 80 : 35,
        speed: isLarge ? 1.2 : 2.0,
        isLarge: isLarge,
        radius: isLarge ? 22 : 15
      });
    }

    function updateGame(delta) {
      const timeScale = isSlowMotion ? 0.4 : 1.0;

      for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.x -= e.speed * timeScale * (canvas.width / 400);

        if (e.x <= 50) {
          playerHp -= e.isLarge ? 25 : 12;
          createParticles(e.x, getLaneY(e.lane), '#ef4444', 8);
          enemies.splice(i, 1);
          playSound('hit');

          if (playerHp <= 0) {
            playerHp = 0;
            updateUI();
            gameOver();
            return;
          }
          updateUI();
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function handleAttackButton() {
      if (!isPlaying) return;
      playerAttack();
    }

    function playerAttack() {
      playSound('hit');
      const targetY = getLaneY(currentLane);
      createParticles(70, targetY, '#00d2ff', 5);

      for (let e of enemies) {
        if (e.lane === currentLane && e.x < canvas.width * 0.7) {
          e.hp -= baseDamage;
          createParticles(e.x, targetY, '#f39c12', 6);

          if (e.hp <= 0) {
            score += e.isLarge ? 30 : 10;
            coinsEarnedRun += e.isLarge ? 3 : 1;
            playSound('coin');
            enemies = enemies.filter(item => item !== e);
          }
          break;
        }
      }
      updateUI();
    }

    function triggerShout() {
      if (!isPlaying || shoutCooldown) return;
      shoutCooldown = true;
      playSound('shout');

      for (let e of enemies) {
        e.x = Math.min(canvas.width - 20, e.x + (canvas.width * 0.4));
        e.hp -= 15;
        createParticles(e.x, getLaneY(e.lane), '#00d2ff', 10);
      }

      enemies = enemies.filter(e => {
        if (e.hp <= 0) {
          score += 10; coinsEarnedRun += 1;
          return false;
        }
        return true;
      });

      updateUI();
      startCooldownUI('shout', shoutCdTime, () => { shoutCooldown = false; });
    }

    function triggerSlowTime() {
      if (!isPlaying || slowCooldown) return;
      slowCooldown = true;
      isSlowMotion = true;
      playSound('slow');

      setTimeout(() => { isSlowMotion = false; }, 4000);
      startCooldownUI('slow', slowCdTime, () => { slowCooldown = false; });
    }

    function startCooldownUI(type, duration, onComplete) {
      const cdEl = document.getElementById(`cooldown-${type}`);
      const textEl = document.getElementById(`cd-${type}-text`);
      cdEl.classList.remove('hidden');

      let remaining = duration / 1000;
      textEl.innerText = `${remaining.toFixed(1)}s`;

      const interval = setInterval(() => {
        remaining -= 0.1;
        if (remaining <= 0) {
          clearInterval(interval);
          cdEl.classList.add('hidden');
          onComplete();
        } else {
          textEl.innerText = `${remaining.toFixed(1)}s`;
        }
      }, 100);
    }

    function getLaneY(laneIndex) {
      const laneHeight = canvas.height / 3;
      return (laneIndex * laneHeight) + (laneHeight / 2);
    }

    function drawGame() {
      ctx.fillStyle = '#06090e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const laneHeight = canvas.height / 3;
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = i === currentLane ? '#00d2ff44' : '#1e293b44';
        ctx.lineWidth = i === currentLane ? 2 : 1;
        ctx.fillStyle = i === currentLane ? '#00d2ff0a' : 'transparent';
        ctx.fillRect(0, i * laneHeight, canvas.width, laneHeight);
        ctx.strokeRect(0, i * laneHeight, canvas.width, laneHeight);
      }

      const playerY = getLaneY(currentLane);
      ctx.fillStyle = '#00d2ff';
      ctx.shadowColor = '#00d2ff';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(40, playerY, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      for (let e of enemies) {
        const ey = getLaneY(e.lane);
        ctx.fillStyle = e.isLarge ? '#ef4444' : '#f39c12';
        ctx.beginPath();
        ctx.arc(e.x, ey, e.radius, 0, Math.PI * 2);
        ctx.fill();

        const hpPercent = e.hp / e.maxHp;
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(e.x - 15, ey - e.radius - 8, 30, 4);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(e.x - 15, ey - e.radius - 8, 30 * hpPercent, 4);
      }

      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1.0;
    }

    function renderEmptyCanvas() {
      ctx.fillStyle = '#06090e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          size: Math.random() * 4 + 2,
          color: color, alpha: 1.0
        });
      }
    }

    function updateUI() {
      document.getElementById('hp-bar').style.width = `${(playerHp / maxHp) * 100}%`;
      document.getElementById('hp-text').innerText = `${Math.ceil(playerHp)}/${maxHp}`;
      document.getElementById('coins-display').innerText = gameData.coins + coinsEarnedRun;
      document.getElementById('score-display').innerText = score;
    }

    function openShop() {
      updateShopUI();
      document.getElementById('shop-overlay').classList.remove('hidden');
    }

    function closeShop() {
      document.getElementById('shop-overlay').classList.add('hidden');
    }

    function updateShopUI() {
      const costDamage = 50 + (gameData.upgrades.damage * 30);
      const costHp = 40 + (gameData.upgrades.hp * 25);
      const costCd = 75 + (gameData.upgrades.cooldown * 50);

      document.getElementById('cost-damage').innerText = costDamage;
      document.getElementById('cost-hp').innerText = costHp;
      document.getElementById('cost-cooldown').innerText = costCd;
      document.getElementById('coins-display').innerText = gameData.coins;
    }

    function buyUpgrade(type) {
      if (type === 'damage') {
        const cost = 50 + (gameData.upgrades.damage * 30);
        if (gameData.coins >= cost) { gameData.coins -= cost; gameData.upgrades.damage++; }
      } else if (type === 'hp') {
        const cost = 40 + (gameData.upgrades.hp * 25);
        if (gameData.coins >= cost) { gameData.coins -= cost; gameData.upgrades.hp++; }
      } else if (type === 'cooldown') {
        const cost = 75 + (gameData.upgrades.cooldown * 50);
        if (gameData.coins >= cost) { gameData.coins -= cost; gameData.upgrades.cooldown++; }
      }
      saveGameData();
    }
  </script>
</body>
</html>
